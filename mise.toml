[settings]
quiet = true
task_output = "interleave"
experimental = true

[plugins]
shiv = "https://github.com/KnickKnackLabs/vfox-shiv"

[tools]
bun = "1.4.2"
"shiv:codebase" = "0.5"
"shiv:readme" = "0.3"

[_.codebase]
name = "trello"
lint = ["@all"]
ci_lint_gate = "mise run validate --verbose"

[tasks.check]
description = "Compatibility alias for the complete validation gate"
run = "mise run validate"

[tasks.typecheck]
description = "Check TypeScript types"
depends = ["schema:fetch"]
run = "bun run typecheck"

[tasks.test]
description = "Run offline tests (no Trello credentials needed)"
depends = ["schema:fetch"]
run = "bun test"

[tasks.generate]
description = "Regenerate API endpoint tasks from the pinned schema"
depends = ["schema:fetch"]
run = "bun scripts/generate.ts"

[tasks.format]
description = "Format authored source and documentation"
run = "bunx --no-install prettier --write ."

[tasks.format-check]
description = "Check authored source and documentation formatting"
run = "bunx --no-install prettier --check ."

[tasks.generate-check]
description = "Verify generated tasks match the pinned schema"
depends = ["schema:fetch"]
run = "bun scripts/generate.ts --check"
